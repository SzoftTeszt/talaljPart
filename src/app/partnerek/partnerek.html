<!-- <p>{{tarskeresok|json}}</p> -->
<div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">

    @for(p of tarskeresok;track p.image){
        <div class="col">
            <div class="card h-100">
                <!-- <img [src]="p.image" class="card-img-top" [alt]="p.name"> -->
                <img src="https://i.pinimg.com/736x/82/47/0b/82470b4ed44c3edacfcd4201e2297050.jpg" class="card-img-top" [alt]="p.name">
                <div class="card-body">
                    <h5 class="card-title">{{p.name}} ({{p.age}})</h5>
                    <p class="card-text">{{p.introductions}}</p>
                </div>
                <div class="card-footer">
                    <small class="text-body-secondary">Last updated 3 mins ago</small>
                </div>
            </div>
        </div>
    }
</div>
